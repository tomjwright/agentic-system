repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
        exclude: ^(feasibility/(evidence|tests/fixtures)/|api/tests/fixtures/|api/src/route_api/singapore_land.geojson|web/openapi.json)
      - id: trailing-whitespace
        exclude: ^(feasibility/(evidence|tests/fixtures)/|api/tests/fixtures/|api/src/route_api/singapore_land.geojson|web/openapi.json)
      - id: check-added-large-files
        args: [--maxkb=1500]
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
