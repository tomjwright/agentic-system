[project]
name = "route-api"
version = "0.1.0"
description = "Backend for the Singapore route creator: place search, start confirmation and owner-scoped route requests."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20,<2",
    "fastapi>=0.165,<1",
    "httpx>=0.28,<1",
    "langchain>=1.4.6,<2",
    "langchain-anthropic>=1.0,<2",
    "langchain-core>=1.8,<2",
    "langchain-google-genai>=4.5.1,<5",
    "langgraph>=1.2.16,<2",
    "opentelemetry-api>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-sdk>=1.27",
    "psycopg[binary]>=3.3,<4",
    "pydantic>=2.14,<3",
    "route-feasibility",
    "sqlalchemy>=2.1,<3",
    "uvicorn>=0.54,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.16,<3",
    "mutmut==3.8.1",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "pip-licenses>=5",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=6",
    "pyyaml>=6",
    "ruff>=0.6",
]

[tool.uv.sources]
route-feasibility = { path = "../feasibility" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/route_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # fake tokens

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "migrations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["route_api"]

[tool.coverage.report]
fail_under = 93
precision = 2
show_missing = true

[tool.mutmut]
source_paths = [
    "src/route_api/agent.py",
    "src/route_api/agent_models.py",
    "src/route_api/auth.py",
    "src/route_api/restrictions.py",
    "src/route_api/promote.py",
    "src/route_api/retention.py",
    "src/route_api/migrate.py",
]
pytest_add_cli_args_test_selection = ["tests/"]
also_copy = ["src/route_api/", "migrations/", "alembic.ini"]
