[project]
name = "route-feasibility"
version = "0.1.0"
description = "Feasibility experiment for the Singapore route creator: real HeiGIT routing, OneMap search and NParks green data."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.9,<3",
]

[dependency-groups]
dev = [
    "mutmut==3.8.1",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "pip-licenses>=5",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=6",
    "ruff>=0.6",
]

[project.scripts]
feasibility = "route_feasibility.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/route_feasibility"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["route_feasibility"]

[tool.coverage.report]
fail_under = 88
precision = 2
show_missing = true

[tool.mutmut]
source_paths = ["src/route_feasibility/restrictions.py"]
pytest_add_cli_args_test_selection = ["tests/"]
also_copy = ["src/route_feasibility/"]
