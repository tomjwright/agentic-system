name: ci

# Deterministic checks only: recorded provider responses, no secrets, no live calls.
# One job per part of the repo, plus a secret scan.
on:
  pull_request:
  push:
    branches: [main, "integration/**"]

permissions:
  contents: read

jobs:
  feasibility:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: feasibility
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      - name: Install exactly what uv.lock pins, failing if the lock is stale
        run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Tests, failing below the coverage floor in pyproject.toml
        run: uv run pytest --cov
      - name: Audit dependencies for known vulnerabilities
        # --disable-pip audits the hashed export as-is, so packages pip-audit itself needs (like pip) are not skipped.
        run: uv export --frozen --no-emit-project | uv run pip-audit --strict --disable-pip -r /dev/stdin
      - name: Fail on any licence outside this permissive list (GPL and AGPL are not on it)
        run: uv run pip-licenses --from=mixed --partial-match --with-system --allow-only "MIT;BSD;Apache;ISC;PSF;Python Software Foundation;MPL-2.0;Mozilla Public License 2.0;LGPL;GNU Lesser General Public License;Unlicense"

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: routes_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/routes_test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/routes_test
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      - name: Install exactly what uv.lock pins (Python from .python-version), failing if the lock is stale
        run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Tests, failing below the coverage floor in pyproject.toml
        run: uv run pytest --cov
      - name: Migrations apply, roll back and re-apply
        run: uv run alembic upgrade head && uv run alembic downgrade base && uv run alembic upgrade head
      - name: Audit dependencies for known vulnerabilities
        run: uv export --frozen --no-emit-project --no-emit-package route-feasibility | uv run pip-audit --strict --disable-pip -r /dev/stdin
      - name: Fail on any licence outside this permissive list (GPL and AGPL are not on it)
        run: uv run pip-licenses --from=mixed --partial-match --with-system --allow-only "MIT;BSD;Apache;ISC;PSF;Python Software Foundation;MPL-2.0;Mozilla Public License 2.0;LGPL;GNU Lesser General Public License;Unlicense"

  migration-compat:
    # A new migration must not break the release still serving while it runs, or the release a
    # rollback returns to: that release's API tests run against this commit's schema.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: routes_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/routes_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      - name: Previous release's API tests on this commit's migrations
        # The previous release is the PR's base commit, or main before this push.
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          base="${PR_BASE_SHA:-$PUSH_BEFORE_SHA}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD~1)"
          fi
          api/scripts/previous_release_tests.sh "$base"

  mutation-feasibility:
    # Mutation testing: mutmut changes the restriction code one small edit at a time and the
    # tests must notice. The floor is in scripts/mutation_floor.py's call below.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: feasibility
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      - run: uv sync --locked
      - name: Mutate route_feasibility/restrictions.py and run the tests on each mutant
        run: uv run mutmut run --max-children 4
      - name: Fail below 94% killed
        run: uv run mutmut results --all true | python3 ../scripts/mutation_floor.py 94

  mutation-api:
    # The same for sign-in (auth.py), the cycling restriction rules (restrictions.py) and the
    # deploy gate (promote.py, retention.py). Each mutant's tests get their own database
    # (tests/conftest.py).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: routes_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/routes_test
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      - run: uv sync --locked
      - name: Mutate sign-in, restriction and deploy-gate code and run the tests on each mutant
        run: uv run mutmut run --max-children 4
      - name: Fail below 94% killed
        run: uv run mutmut results --all true | python3 ../scripts/mutation_floor.py 94

  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: routes_e2e
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci
      - run: (cd ../api && uv sync --locked)
      - name: Browser types match the API's OpenAPI document
        run: |
          (cd ../api && uv run python -m route_api.openapi) > openapi.json
          npm run types
          git diff --exit-code -- openapi.json src/api-types.ts
      - run: npm run lint
      - name: Audit dependencies for known vulnerabilities
        run: npm audit --audit-level=moderate
      # react-leaflet is Hippocratic-2.1 (not OSI-approved): excluded by name and version, so any
      # other package, or a new react-leaflet version, must pass the list or be reviewed again.
      - name: Fail on any production package licence outside this permissive list
        run: >-
          npx --yes license-checker-rseidelsohn@4.4.2 --production --excludePrivatePackages --summary
          --excludePackages "@react-leaflet/core@3.0.0;react-leaflet@5.0.0"
          --onlyAllow "MIT;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0;0BSD;BlueOak-1.0.0;CC0-1.0;CC-BY-4.0;MPL-2.0;LGPL-3.0-or-later;OFL-1.1"
      - run: npx playwright install --with-deps chromium
      - name: API-to-browser tests (desktop and mobile)
        # A synthetic key in the build environment must not reach the bundle (checked below).
        env:
          HEIGIT_API_KEY: synthetic-heigit-key-must-not-ship
        run: npm run e2e
      - name: The deploy's staged browser test, against the recorded API from an origin it does not trust
        run: npm run e2e:staged
      - name: No OneMap or HeiGIT call, token or key, model key name or fake model in the browser bundle
        run: |
          if grep -rl -e "onemap.gov.sg/api" -e "ONEMAP_API_TOKEN" .next/static; then exit 1; fi
          if grep -rl -e "ANTHROPIC_API_KEY" -e "GOOGLE_API_KEY" -e "FakeModel" -e "scripted-agent" .next/static; then
            exit 1
          fi
          if grep -rl -e "api.heigit.org" -e "HEIGIT_API_KEY" -e "synthetic-heigit-key-must-not-ship" .next; then
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: web/test-results/

  render-smoke:
    # render.yaml's build and start commands, exactly as written, on a fresh runner and
    # PostgreSQL 17 (scripts/render_smoke.sh). Fails unless /api/ready answers 200. Provider
    # settings are synthetic: readiness only checks they are set, and nothing calls a provider.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: routes_render
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/routes_render
      APP_ORIGIN: https://app.example.invalid
      OWNER_GITHUB_IDS: "119127762"
      GITHUB_CLIENT_ID: synthetic-client
      GITHUB_CLIENT_SECRET: synthetic-github-secret-must-not-ship
      ONEMAP_API_TOKEN: synthetic-onemap-token-must-not-ship
      HEIGIT_API_KEY: synthetic-heigit-key-must-not-ship
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: The Python render.yaml asks Render for
        id: python
        run: echo "version=$(yq -e '.services[0].envVars[] | select(.key == "PYTHON_VERSION") | .value' render.yaml)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: false
      - name: Put that exact Python, with pip, on PATH (setup-python lacks some patches)
        env:
          PYTHON_VERSION: ${{ steps.python.outputs.version }}
        run: |
          uv venv --seed --python "$PYTHON_VERSION" "$RUNNER_TEMP/render-python"
          echo "$RUNNER_TEMP/render-python/bin" >> "$GITHUB_PATH"
      - run: scripts/render_smoke.sh

  vercel-build:
    # Builds the page as Vercel does (vercel build, web/vercel.json, root directory web) with
    # synthetic provider settings in the environment, then scans the output with the deploy
    # workflow's own list (scripts/no_provider_secrets.sh). Needs no Vercel token.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_URL: https://api.example.invalid
      ONEMAP_API_TOKEN: synthetic-onemap-token-must-not-ship
      HEIGIT_API_KEY: synthetic-heigit-key-must-not-ship
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install the Vercel CLI that ops/vercel-cli/package-lock.json pins
        run: npm ci --prefix ops/vercel-cli
      - name: The project settings vercel pull would write (framework Next.js, root directory web)
        run: |
          mkdir -p .vercel
          echo '{"projectId": "ci", "orgId": "ci", "settings": {"framework": "nextjs", "rootDirectory": "web"}}' > .vercel/project.json
      - run: ops/vercel-cli/node_modules/.bin/vercel build --prod --yes
      - run: scripts/no_provider_secrets.sh .vercel/output

  # Free on private repos: no Semgrep login and no upload to GitHub code scanning.
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      - name: Fail on any Semgrep finding in the code or the workflows
        run: >-
          uvx --python 3.12 semgrep@1.187.0 scan --metrics=off --error
          --config p/python --config p/typescript --config p/react --config p/github-actions
          feasibility/src api/src web/src .github

  secrets-scan:
    # Scans the whole git history on every run, so no commit range (merge pushes, long PRs) is skipped.
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.21.2
      GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" gitleaks
      - name: Scan all commits for secrets
        run: ./gitleaks git --redact --no-banner .
      # git log shows no diff for a merge commit, so also scan the files as they are now.
      - name: Scan the checked-out files for secrets
        run: ./gitleaks dir --redact --no-banner .
