name: feasibility

# Deterministic checks only: recorded provider responses, no secrets, no live calls.
on:
  pull_request:
  push:
    branches: [main, "integration/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: feasibility
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install exactly what uv.lock pins, failing if the lock is stale
        run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - name: Audit dependencies for known vulnerabilities
        # --disable-pip audits the hashed export as-is, so packages pip-audit itself needs (like pip) are not skipped.
        run: uv export --frozen --no-emit-project | uv run pip-audit --strict --disable-pip -r /dev/stdin

  secrets-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
